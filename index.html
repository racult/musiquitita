function ren(id){const p=pls.find(x=>x.id==id),n=prompt('Nombre',p.n);if(n&&n.trim()){p.n=n.trim();sv('pls',pls);render()}}
function tgSel(id){selPl=selPl.includes(id)?selPl.filter(x=>x!=id):[...selPl,id];render()}
function delSel(){if(!selPl||!selPl.length)return;if(!confirm(selPl.length==1?'¿Eliminar 1 playlist?':`¿Eliminar ${selPl.length} playlists?`))return;pls=pls.filter(x=>!selPl.includes(x.id));sv('pls',pls);selPl=null;render()}
function del(id){if(confirm('Eliminar playlist')){pls=pls.filter(x=>x.id!=id);sv('pls',pls);view=null;render()}}
function pic(id){const f=$('#file');f.value='';f.onchange=()=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=400;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,400,400);pls.find(x=>x.id==id).img=c.toDataURL('image/jpeg',.8);sv('pls',pls);render()};im.src=r.result};r.readAsDataURL(f.files[0])};f.click()}
const jp=u=>new Promise(r=>{const n='cb'+Math.random().toString(36).slice(2),s=document.createElement('script');window[n]=d=>{r(d);s.remove();delete window[n]};s.onerror=()=>r(null);s.src=u+'&output=jsonp&callback='+n;document.head.append(s);setTimeout(()=>r(null),8000)});
const recKey=()=>new Date().toLocaleDateString('sv')+'|'+artists().map(a=>norm(a.n)+':'+a.s.length).join(',');
function rng(seed){let h=1779033703;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),3432918353)>>>0;return()=>{h=Math.imul(h^h>>>15,2246822507)>>>0;h=Math.imul(h^h>>>13,3266489909)>>>0;return((h^=h>>>16)>>>0)/4294967296}}
const shuf=(a,R)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let recK='';
async function loadRecs(){const key=recKey();recK=key;
 try{const c=JSON.parse(localStorage.getItem('recs'));if(c&&c.k===key){recs=c.r;if(tab=='rec')render();return}}catch{}
 const R=rng(key),have=new Set(lib.map(s=>norm(s.a))),out=[],seen=new Set(),all=artists().filter(a=>a.n!=='Sin artista');
 // artistas semilla: ponderados por cuántas canciones tienes, pero distintos cada día
 const pool=[];all.forEach(a=>{for(let i=0;i<Math.min(a.s.length,5);i++)pool.push(a)});
 const seeds=[];for(const a of shuf(pool,R)){if(!seeds.includes(a))seeds.push(a);if(seeds.length>=6)break}
 for(const a of seeds){const f=await jp('https://api.deezer.com/search/artist?limit=1&q='+encodeURIComponent(a.n));const id=f&&f.data&&f.data[0]&&f.data[0].id;if(!id)continue;
  const rel=await jp(`https://api.deezer.com/artist/${id}/related?limit=20`);
  for(const r of shuf((rel&&rel.data)||[],R).filter(r=>!have.has(norm(r.name))&&!seen.has(r.id)).slice(0,3)){seen.add(r.id);
   const tp=await jp(`https://api.deezer.com/artist/${r.id}/top?limit=10`);shuf((tp&&tp.data)||[],R).slice(0,1+Math.floor(R()*2)).forEach(t=>out.push({f:'r'+t.id,t:t.title,a:r.name,u:t.preview,img:t.album&&t.album.cover_big,why:a.n,rec:1}))}}
 if(recK!==key)return;recs=shuf(out,R);if(out.length)sv('recs',{k:key,r:recs});if(tab=='rec')render()}
function recList(){if(!recs.length)return '<p class="mut">No hay recomendaciones por ahora. Añade más canciones o revisa la conexión.</p>';cur=recs;return recs.map((s,i)=>row(s,i,false,s.a+' · parecido a '+s.why)).join('')}
// --- Resúmenes y configuración (perfil) ---
function openV(v){view=v;render();$('#main').scrollTop=0}
function recapIdx(){const ys=yearsAvail(),ms=monthsAvail(),n=new Date(),nxt=new Date(n.getFullYear(),n.getMonth()+1,1);
 const it=(v,l,t,s)=>`<div class="row" onclick="openV(${v})"><div class="cv favc"><b>${l}</b></div><div class="x"><div>${t}</div><div class="mut">${s}</div></div></div>`;
 return `<h2>Resúmenes</h2>`+ys.map(y=>it(`{t:'recap',y:${y}}`,y,'Resumen anual '+y,'1 dic '+(y-1)+' – 30 nov '+y)).join('')
  +ms.map(k=>it(`{t:'recap',k:'${k}'}`,new Date(k+'-01T12:00').toLocaleDateString('es',{month:'short'}).replace('.',''),'Resumen de '+mname(k),Math.round(stats[k]/60)+' min')).join('')
  +`<p class="mut">El resumen de ${mname(mk())} estará disponible el 1 de ${nxt.toLocaleDateString('es',{month:'long'})}.${n.getMonth()!=11?' El resumen anual estará disponible el 1 de diciembre.':''}</p>`}
function recapView(){const y=view.y!==undefined,keys=y?yKeys(view.y):[view.k],R=recapOf(keys),top=R.songs.slice(0,y?10:5);
 if(!keys.length){view=null;return ''}
 cur=top.map(x=>byF(x.f)).filter(Boolean);
 const mins=Math.round(R.sec/60),plays=R.songs.reduce((a,x)=>a+x.n,0),title=y?'Resumen anual '+view.y:cap(mname(view.k)),sb=y?cap(mshort(keys[0]))+' – '+cap(mshort(view.y+'-11')):'Resumen mensual';
 let h=`<button class="btn o" onclick="view=null;render()">Volver</button><h1 style="margin-top:14px">${esc(title)}</h1><div class="sub" style="margin-bottom:0">${esc(sb)}</div>
 <div class="stat"><div><b>${mins}</b><span>${y?'minutos en el año':'minutos'}</span></div><div><b>${plays}</b><span>reproducciones</span></div><div><b>${R.songs.length}</b><span>canciones</span></div></div>`;
 if(!R.songs.length)h+=`<p class="mut">En este periodo todavía no se registraba qué canciones escuchabas, solo los minutos.</p>`;
 else{const t1=R.songs[0],s1=byF(t1.f);
  h+=`<h2>Tu canción más escuchada</h2><div class="cv big" data-f="${esc(t1.f)}">${covIn(s1||{f:t1.f})}</div><div style="text-align:center;margin-bottom:6px"><div style="font-size:22px;font-weight:700">${esc(t1.t)}</div><div class="pk" style="margin-top:4px">${esc(t1.a)}</div><div class="mut">${t1.n} ${t1.n==1?'vez':'veces'}</div></div>`;
  if(y&&R.arts.length)h+=`<h2>Top 5 artistas</h2>`+R.arts.slice(0,5).map((a,r)=>{const s=lib.find(x=>norm(x.a)==norm(a.a));return `<div class="row"><div class="rk">${r+1}</div>${cv(s||{f:a.a})}<div class="x"><div>${esc(a.a)}</div><div class="mut">${Math.round(a.s/60)} min</div></div></div>`}).join('');
  h+=`<h2>Top ${y?10:5} canciones</h2>`+(cur.length?`<div style="margin-bottom:8px">${actions()}</div>`:'')
   +top.map((x,r)=>{const s=byF(x.f),i=s?cur.indexOf(s):-1;return `<div class="row"${i>=0?` onclick="P(${i})"`:''}><div class="rk">${r+1}</div>${cv(s||{f:x.f})}<div class="x"><div>${esc(x.t)}</div><div class="mut">${esc(x.a)} · ${x.n} ${x.n==1?'vez':'veces'}${y?' · '+Math.round(x.s/60)+' min':''}</div></div></div>`}).join('')}
 if(y){const mx2=Math.max(1,...keys.map(k=>stats[k]));h+=`<h2>Minutos por mes</h2>`+keys.map(k=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>${cap(mname(k))}</span><span class="pk">${Math.round(stats[k]/60)} min</span></div><div class="bar" style="width:${stats[k]/mx2*100}%"></div></div>`).join('')}
 return h}
function cfgHtml(){const sw=Object.keys(PAL).map(c=>`<button class="${cfg.color==c?'on':''}" style="background:${PAL[c]}" aria-label="${c}" onclick="setColor('${c}')"></button>`).join('');
 return `<h2>Configuración</h2><div class="mut" style="margin-bottom:6px">Nombre del perfil</div><input type="text" maxlength="30" value="${esc(cfg.name)}" oninput="setCfg('name',this.value)"><div class="mut" style="margin-bottom:6px">Nombre que sigue a «Biblioteca de»</div><input type="text" maxlength="30" value="${esc(cfg.lib)}" oninput="setCfg('lib',this.value)"><div class="mut" style="margin:6px 0">Color · ${cfg.color}</div><div class="sw">${sw}</div><div class="mut" style="margin:14px 0 6px">Fondo de la app</div><div class="seg"><b class="${cfg.bg!='color'?'on':''}" onclick="setBg('negro')">Negro</b><b class="${cfg.bg=='color'?'on':''}" onclick="setBg('color')">Translúcido ${esc(cfg.color)}</b></div>`}
function setCfg(k,v){cfg[k]=v;sv('cfg',cfg);const e=$(k=='name'?'#pn':'#pb');if(e)e.textContent=k=='name'?nameTxt():libTxt()}
function setColor(c){cfg.color=c;sv('cfg',cfg);applyColor();const m=$('#main'),sc=m.scrollTop;render();m.scrollTop=sc;ui()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
applyColor();nav();render();load();
</script></body></html>
